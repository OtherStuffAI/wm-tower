# Dedicated Tower transport peer. Install with fips.key/fips.pub in this directory.
# This daemon must never reuse the consuming Autopilot daemon's identity.
node:
  identity:
    persistent: true
  leaf_only: true
  control:
    enabled: true
    socket_path: /var/run/fips-tower.sock
  rendezvous:
    nostr:
      enabled: true
      policy: open
      app: "wingman-fips-poc-v1"
      advertise: true
      share_local_candidates: true
    lan:
      enabled: true
      scope: "wingman-fips-poc-v1"

tun:
  enabled: true
  name: fipstower0
  mtu: 1280

dns:
  enabled: false

transports:
  udp:
    bind_addr: "0.0.0.0:2122"
    advertise_on_nostr: true
    public: false
    accept_connections: true

peers:
  - npub: "npub1qmc3cvfz0yu2hx96nq3gp55zdan2qclealn7xshgr448d3nh6lks7zel98"
    alias: "wingman-bootstrap"
    addresses:
      - transport: udp
        addr: "217.77.8.91:2121"
    connect_policy: auto_connect
