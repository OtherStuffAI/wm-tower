[extend]
useDefault = true

[allowlist]
description = "Documented non-secret deployment placeholders"
regexTarget = "match"
regexes = [
  '''GIT_OIDC_SIGNING_KEY=REPLACE_WITH_PKCS8_RSA_PRIVATE_KEY_PEM''',
  # Public request example: an idempotency UUID grants no authentication.
  '''idempotency_key":"6c5e818f-bf8a-4df8-9ffc-ed5753ce5891"''',
]

[[rules]]
id = "nostr-nsec"
description = "Nostr bech32 private key"
regex = '''\bnsec1[023456789acdefghjklmnpqrstuvwxyz]{20,}\b'''
keywords = ["nsec1"]
